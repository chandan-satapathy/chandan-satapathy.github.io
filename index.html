  <!--
    Pre-paint theme script (duplicated intentionally on every page): reads
    localStorage.theme and sets data-theme on <html> before first paint, so
    there's no flash of the wrong theme. Default is "light" if nothing is
    stored yet.
  -->
  <script>
    (function () {
      try {
        var stored = window.localStorage.getItem("theme");
        var theme = stored === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
